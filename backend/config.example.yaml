# SubRadar — конфигурация бэкенда
# Документация: https://github.com/OctopyApps/SubRadar-BackEnd
#
# Скопируйте этот файл в config.yaml и подставьте свои значения:
#   cp config.example.yaml config.yaml
# config.yaml не коммитится в git (см. .gitignore).

server:
  port: 8080

storage:
  # Выберите драйвер: sqlite | postgres
  driver: sqlite

  sqlite:
    path: ./subradar.db

  postgres:
    # DSN формат: postgres://user:password@host:5432/dbname?sslmode=disable
    # Можно оставить пустым и передать через переменную окружения SUBRADAR_STORAGE_POSTGRES_DSN
    dsn: ""

auth:
  jwt_secret: "CHANGE_ME"
  self_hosted: true
  server_secret: "CHANGE_ME"
  # true — ставить Secure на auth-cookie. Только если сервер за HTTPS,
  # иначе браузер не будет отправлять cookie обратно. См. README.md.
  cookie_secure: false

cors:
  # true — разрешить любой origin (веб-клиенту). Для self_hosted включается
  # автоматически, если явно не задано. См. README.md, раздел "Конфигурация".
  allow_all: false
  # Явный список разрешённых origin — актуально для shared-режима.
  # origins: ["https://app.example.com"]

push:
  # Web Push (напоминания о списании для веб-клиента). Опционально: если
  # публичный/приватный ключ не заданы — /push/* и фоновая джоба отключены.
  # Сгенерировать: webpush.GenerateVAPIDKeys() из github.com/SherClockHolmes/webpush-go.
  # vapid_public_key: "CHANGE_ME"
  # vapid_private_key: "CHANGE_ME"
  # vapid_subscriber: "mailto:you@example.com"
  check_hour: 10
